name: Sync PyPI versions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-pypi-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if pixi.lock changed
      id: check
      run: |
        set -eux
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- pixi.lock | grep -q .; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install pixi
      if: steps.check.outputs.changed == 'true'
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.70.2
        cache: false
        manifest-path: pyproject.toml

    - name: Sync pyproject.toml versions
      if: steps.check.outputs.changed == 'true'
      run: |
        set -eux
        pixi run sync-pypi-versions

    - name: Open pull request with changes
      if: steps.check.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "chore: sync pyproject.toml versions with pixi.lock"
        branch: sync-pypi-versions
        title: "chore: sync PyPI dependency versions with pixi.lock"
        body: |
          Auto-generated by `.github/workflows/sync-pypi-versions.yml` after `pixi.lock`
          changed on `main`.

          Pins `[project.dependencies]`, `[project.optional-dependencies]`, and
          `[dependency-groups]` to the exact versions pixi resolved, so
          `pip install fileglancer` matches the pixi/conda environment. Where a
          package resolves to different versions across pixi environments or
          platforms (e.g. a compiled test-only dependency built differently per
          platform), the entry is split into multiple `python_version` /
          `sys_platform` / `platform_machine`-qualified requirements instead of a
          single pin.

          Generated by `pixi run sync-pypi-versions`
          (`scripts/sync_pyproject_versions.py`) -- safe to review and merge, or
          to close if the change looks wrong.
        delete-branch: true
        labels: dependencies
